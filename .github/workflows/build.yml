name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o Lwidget-dark.zip
          # Di chuyển nội dung ra ngoài nếu bị lồng thư mục
          if [ -d "Lwidget-2.4" ]; then
            shopt -s dotglob
            mv Lwidget-2.4/* .
            rmdir Lwidget-2.4
          fi
          ls -la
          test -f gradlew && echo "gradlew found" || echo "gradlew NOT found"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v -storetype PKCS12 -keystore my-release-key.jks \
            -alias lwidget -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Lwidget Mod, OU=Personal, O=User, L=City, ST=State, C=VN"
          echo "storePassword=android" > keystore.properties
          echo "keyPassword=android" >> keystore.properties
          echo "keyAlias=lwidget" >> keystore.properties
          echo "storeFile=../my-release-key.jks" >> keystore.properties

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lwidget-mod-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
